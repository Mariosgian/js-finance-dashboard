<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal finance tracker — built with vanilla JS, no dependencies." />
  <title>Finance Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">💰 Finance</h1>
      <div class="header-actions">
        <button class="btn btn-ghost" id="exportBtn">Export CSV</button>
        <button class="btn btn-ghost theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
      </div>
    </div>
  </header>

  <main class="main">
    <!-- Summary Cards -->
    <section class="cards" aria-label="Financial summary">
      <div class="card card--income">
        <p class="card-label">Income</p>
        <p class="card-amount" id="totalIncome">€0.00</p>
      </div>
      <div class="card card--expense">
        <p class="card-label">Expenses</p>
        <p class="card-amount" id="totalExpenses">€0.00</p>
      </div>
      <div class="card card--balance">
        <p class="card-label">Balance</p>
        <p class="card-amount" id="balance">€0.00</p>
      </div>
    </section>

    <div class="grid">
      <!-- Add Transaction Form -->
      <section class="panel" aria-label="Add transaction">
        <h2 class="panel-title">Add Transaction</h2>
        <form class="form" id="transactionForm" novalidate>
          <div class="form-group">
            <label class="label" for="description">Description</label>
            <input class="input" id="description" type="text" placeholder="e.g. Grocery shopping" required maxlength="60" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="label" for="amount">Amount (€)</label>
              <input class="input" id="amount" type="number" placeholder="0.00" min="0.01" step="0.01" required />
            </div>
            <div class="form-group">
              <label class="label" for="type">Type</label>
              <select class="input" id="type">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="label" for="category">Category</label>
            <select class="input" id="category">
              <option value="food">🍔 Food</option>
              <option value="transport">🚌 Transport</option>
              <option value="entertainment">🎬 Entertainment</option>
              <option value="health">💊 Health</option>
              <option value="utilities">⚡ Utilities</option>
              <option value="salary">💼 Salary</option>
              <option value="freelance">💻 Freelance</option>
              <option value="other">📦 Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="label" for="date">Date</label>
            <input class="input" id="date" type="date" required />
          </div>
          <p class="form-error hidden" id="formError" role="alert"></p>
          <button class="btn btn-primary" type="submit">Add Transaction</button>
        </form>
      </section>

      <!-- Chart Panel -->
      <section class="panel" aria-label="Spending chart">
        <h2 class="panel-title">Monthly Overview</h2>
        <canvas id="barChart" width="400" height="220" aria-label="Monthly income and expenses bar chart"></canvas>
        <div class="chart-legend" id="chartLegend"></div>
      </section>
    </div>

    <!-- Category Breakdown -->
    <section class="panel" aria-label="Category breakdown">
      <h2 class="panel-title">Categories</h2>
      <div class="categories" id="categoriesGrid"></div>
    </section>

    <!-- Transactions List -->
    <section class="panel" aria-label="Transaction history">
      <div class="list-header">
        <h2 class="panel-title">Transactions</h2>
        <div class="filters">
          <select class="input input--sm" id="filterType">
            <option value="all">All</option>
            <option value="income">Income</option>
            <option value="expense">Expenses</option>
          </select>
          <select class="input input--sm" id="filterMonth">
            <option value="all">All months</option>
          </select>
        </div>
      </div>
      <ul class="transactions" id="transactionsList" aria-live="polite"></ul>
      <p class="empty-state hidden" id="emptyState">No transactions yet. Add your first one above.</p>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
